services:
  - type: web
    name: rsk-garant
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Укажите URL вашего приложения на Render, иначе форма будет
      # отклоняться проверкой Origin. Пример: https://rsk-garant.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://rsk-garant.ru
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false